name: ساخت اپ کانکی
on:
  push:
  workflow_dispatch:

# نوشتن مخزن فقط برای گذاشتن فایل نصبی در Releases؛ کلید امضا فقط از Secrets می‌آید
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: دریافت فونت‌ها
        run: |
          mkdir -p app/src/main/res/font
          rm -f app/src/main/res/raw/kanki_intro.wav
          dl() { curl -fsSL --retry 3 -o "app/src/main/res/font/$1" "$2" || curl -fsSL --retry 3 -o "app/src/main/res/font/$1" "$3"; }
          # وزیرمتن داخل خود مخزن است (res/font/vazir_*.ttf)؛ دانلود نمی‌شود
          G1=https://raw.githubusercontent.com/google/fonts/main/ofl
          G2=https://github.com/google/fonts/raw/main/ofl
          dl poppins_semibold.ttf $G1/poppins/Poppins-SemiBold.ttf $G2/poppins/Poppins-SemiBold.ttf
          dl poppins_bold.ttf     $G1/poppins/Poppins-Bold.ttf     $G2/poppins/Poppins-Bold.ttf
          dl orbitron.ttf "$G1/orbitron/Orbitron%5Bwght%5D.ttf" "$G2/orbitron/Orbitron%5Bwght%5D.ttf"
          ls -la app/src/main/res/font

      - name: دریافت نقشه‌ی کشورها
        run: |
          mkdir -p app/src/main/assets
          rm -f app/src/main/assets/land.geojson
          curl -fsSL --retry 3 -o app/src/main/assets/countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson || curl -fsSL --retry 3 -o app/src/main/assets/countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson || curl -fsSL --retry 3 -o app/src/main/assets/countries.geojson https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/110m/cultural/ne_110m_admin_0_countries.json || echo '{"features":[]}' > app/src/main/assets/countries.geojson
          ls -la app/src/main/assets

      # نسخه‌ی هسته ثابت است (نه «آخرین نسخه»)، تا هر ساخت دقیقاً همان هسته‌ی تست‌شده را بگیرد.
      # برای ارتقا فقط HY_VERSION را عوض کن (فهرست نسخه‌ها: github.com/HyNetworks/hysteria/releases؛ ریپو قبلاً apernet بود و لینک قدیمی ۵۰۴ می‌دهد).
      - name: دریافت هسته‌ی Hysteria2
        env:
          HY_VERSION: v2.12.3
        run: |
          set -e
          base="https://github.com/HyNetworks/hysteria/releases/download/app%2F$HY_VERSION"
          # آینه‌ی رسمی خود Hysteria؛ وقتی دانلود گیت‌هاب ۵۰۴ می‌دهد (2026-11-09 چند ساعت داد). اثر انگشت همان است.
          mirror="https://download.hysteria.network/app/$HY_VERSION"
          fetch() { # $1=اسم فایل  $2=مقصد: اول گیت‌هاب، بعد آینه
            curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$2" "$base/$1" ||
              curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$2" "$mirror/$1"
          }
          # فهرست اثر انگشت (SHA256) فایل‌ها که خود Hysteria برای همین نسخه منتشر کرده
          fetch hashes.txt /tmp/hy-hashes.txt
          get() { # $1=ABI اندروید  $2=اسم معماری در فایل‌های Hysteria
            d=app/src/main/jniLibs/$1; mkdir -p "$d"
            f="hysteria-android-$2"
            fetch "$f" "$d/libhysteria.so"
            want=$(awk -v f="$f" '{ n = $2; sub(/^.*\//, "", n); if (n == f) print $1 }' /tmp/hy-hashes.txt)
            got=$(sha256sum "$d/libhysteria.so" | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "::error::SHA256 of $f does not match ($HY_VERSION): want=$want got=$got"; exit 1
            fi
            chmod +x "$d/libhysteria.so"
            echo "$1 <- $f ($HY_VERSION) sha256=$got"
          }
          get arm64-v8a arm64
          get armeabi-v7a armv7
          ls -la app/src/main/jniLibs/*

      # هسته‌ی Xray-core، نسخه‌ی ثابت و تست‌شده (همان که پنل با آن کانفیگ‌ها را چک می‌کند).
      # فایل‌های geoip/geosite برداشته نمی‌شوند (حجم کم)؛ کانفیگ اپ به آن‌ها نیاز ندارد.
      - name: دریافت هسته‌ی Xray-core
        env:
          XRAY_VERSION: v26.3.27
        run: |
          set -e
          base="https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION"
          get() { # $1=ABI اندروید  $2=فایل zip
            d=app/src/main/jniLibs/$1; mkdir -p "$d"
            curl -fsSL --retry 3 -o /tmp/x.zip "$base/$2"
            curl -fsSL --retry 3 -o /tmp/x.dgst "$base/$2.dgst"
            want=$(grep -m1 '^SHA2-256' /tmp/x.dgst | awk '{print $2}')
            got=$(sha256sum /tmp/x.zip | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "::error::SHA256 of $2 does not match ($XRAY_VERSION): want=$want got=$got"; exit 1
            fi
            rm -rf /tmp/xr && unzip -q -o /tmp/x.zip xray -d /tmp/xr
            mv /tmp/xr/xray "$d/libxray.so"; chmod +x "$d/libxray.so"
            echo "$1 <- $2 ($XRAY_VERSION) sha256=$got"
          }
          get arm64-v8a Xray-android-arm64-v8a.zip
          get armeabi-v7a Xray-linux-arm32-v7a.zip
          ls -la app/src/main/jniLibs/*

      - name: ساخت tun2socks برای Hysteria2 (hev-socks5-tunnel)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK}}"
          if [ ! -x "$NDK/ndk-build" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          echo "NDK: $NDK"
          rm -rf /tmp/hev && mkdir -p /tmp/hev && cd /tmp/hev
          git clone --recursive --depth 1 --branch 2.17.1 https://github.com/heiher/hev-socks5-tunnel jni
          printf '%s\n' \
            'APP_OPTIM := release' \
            'APP_PLATFORM := android-26' \
            'APP_ABI := armeabi-v7a arm64-v8a' \
            'APP_CFLAGS := -O3 -DPKGNAME=cafe/kankipro/vpn -DCLSNAME=TProxyService' \
            'APP_SUPPORT_FLEXIBLE_PAGE_SIZES := true' \
            'NDK_TOOLCHAIN_VERSION := clang' > jni/Application.mk
          "$NDK/ndk-build" -j"$(nproc)"
          cd "$GITHUB_WORKSPACE"
          for a in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$a
            cp /tmp/hev/libs/$a/libhev-socks5-tunnel.so app/src/main/jniLibs/$a/
          done
          ls -la app/src/main/jniLibs/*

      # هسته‌ی KANKI MIX (پروتکل خود کانکی، پوشه‌ی kmix-core) برنامه‌ی جدای libkmix.so است، مثل Hysteria2
      # و Xray در پروسه‌ی خودش (رانتایم Go آن هیچ‌وقت کنار موتور AmneziaWG در پروسه‌ی برنامه نیست).
      # نسخه‌ی Go از go.mod همان پوشه می‌آید تا هر ساخت دقیقاً همان هسته‌ی تست‌شده باشد.
      - uses: actions/setup-go@v6
        with:
          go-version-file: kmix-core/go.mod
          cache-dependency-path: kmix-core/go.sum

      - name: ساخت هسته‌ی KANKI MIX (libkmix.so)
        working-directory: kmix-core
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK}}"
          if [ ! -d "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK: $NDK"
          go vet -tags tcp ./...
          go test ./internal/... ./cmd/...
          build() { # $1=ABI  $2=GOARCH  $3=clang
            d=../app/src/main/jniLibs/$1; mkdir -p "$d"
            CGO_ENABLED=1 GOOS=android GOARCH=$2 GOARM=7 CC="$TC/$3" \
              go build -tags tcp -trimpath -ldflags "-s -w" -o "$d/libkmix.so" ./cmd/kmix
            chmod +x "$d/libkmix.so"
            file "$d/libkmix.so"
          }
          build arm64-v8a arm64 aarch64-linux-android26-clang
          build armeabi-v7a arm armv7a-linux-androideabi26-clang

      # هسته‌ی microtun (پوشه‌ی mtun-core) هم برنامه‌ی جدای libmtun.so است، مثل KANKI MIX. پروتکلش (proto.go) همان
      # هسته‌ی microtun ریپوی Labo است که سرورهای پنل با آن حرف می‌زنند.
      - name: ساخت هسته‌ی microtun (libmtun.so)
        working-directory: mtun-core
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK}}"
          if [ ! -d "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          go vet ./...
          go test ./...
          build() { # $1=ABI  $2=GOARCH  $3=clang
            d=../app/src/main/jniLibs/$1; mkdir -p "$d"
            CGO_ENABLED=1 GOOS=android GOARCH=$2 GOARM=7 CC="$TC/$3" \
              go build -trimpath -ldflags "-s -w" -o "$d/libmtun.so" .
            chmod +x "$d/libmtun.so"
            file "$d/libmtun.so"
          }
          build arm64-v8a arm64 aarch64-linux-android26-clang
          build armeabi-v7a arm armv7a-linux-androideabi26-clang

      # هسته‌ی KPING (پوشه‌ی kping-core) هم برنامه‌ی جدای libkping.so است. قالب بسته‌اش همان src/vpn/kpingd.rs پنل است
      # (بردار تست مشترک در kping/wire_test.go).
      - name: ساخت هسته‌ی KPING (libkping.so)
        working-directory: kping-core
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK}}"
          if [ ! -d "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          go vet ./...
          go test ./...
          build() { # $1=ABI  $2=GOARCH  $3=clang
            d=../app/src/main/jniLibs/$1; mkdir -p "$d"
            CGO_ENABLED=1 GOOS=android GOARCH=$2 GOARM=7 CC="$TC/$3" \
              go build -trimpath -ldflags "-s -w" -o "$d/libkping.so" .
            chmod +x "$d/libkping.so"
            file "$d/libkping.so"
          }
          build arm64-v8a arm64 aarch64-linux-android26-clang
          build armeabi-v7a arm armv7a-linux-androideabi26-clang

      - name: آماده‌سازی کلید امضا (از GitHub Secrets)
        env:
          KANKI_KEYSTORE: ${{ secrets.KANKI_KEYSTORE }}
          KANKI_KEY_PASS: ${{ secrets.KANKI_KEY_PASS }}
        run: |
          if [ -z "$KANKI_KEYSTORE" ] || [ -z "$KANKI_KEY_PASS" ]; then echo "::error::GitHub Secrets (KANKI_KEYSTORE / KANKI_KEY_PASS) تنظیم نشده‌اند"; exit 1; fi
          echo "$KANKI_KEYSTORE" | base64 -d > app/kanki-release.jks
          keytool -list -keystore app/kanki-release.jks -storepass "$KANKI_KEY_PASS" | head -3

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: ساخت فایل نصبی
        env:
          KANKI_KEY_PASS: ${{ secrets.KANKI_KEY_PASS }}
        run: gradle assembleRelease --stacktrace

      - name: حجم فایل‌ها
        run: ls -la app/build/outputs/apk/release/

      # قفل کلید امضا: هر APK باید با همان کلید همیشگی (همانی که نسخه‌های قبلی کاربران با آن نصب شده) امضا شده باشد،
      # با V1 و V2 و V3، و تراز (zipalign) درست. اگر نه، ساخت قرمز می‌شود و هیچ فایلی منتشر یا به تلگرام فرستاده نمی‌شود.
      - name: بررسی امضا و تراز فایل‌های نصبی
        env:
          KANKI_CERT_SHA256: d2f8b9c44c65183126fdc192d14b6bca275f3d4cb4850b2bc9be7b7982d54df8
        run: |
          set -e
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            echo "== $f"
            "$bt/zipalign" -c -P 16 4 "$f" || "$bt/zipalign" -c 4 "$f"
            # --min-sdk-version 18: تا امضای V1 هم واقعاً بررسی شود (با minSdk 26 خودش V1 را نمی‌سنجد)
            out=$("$bt/apksigner" verify --verbose --print-certs "$f")
            echo "$out" | grep -E "scheme|SHA-256 digest|DN"
            for v in "v2 scheme"; do
              echo "$out" | grep -q "Verified using $v.*: true" || { echo "::error::$f بدون امضای $v"; exit 1; }
            done
            # همه‌ی امضاکننده‌ها (V1/V2 و V3.0) باید همان یک کلید باشند
            certs=$(echo "$out" | grep -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}' | sort -u)
            [ "$certs" = "$KANKI_CERT_SHA256" ] || { echo "::error::$f با کلید دیگری امضا شده است: $certs"; exit 1; }
          done

      # فایل نصبی در Releases گذاشته می‌شود (یک نسخه‌ی پیش‌انتشار برای هر شاخه که هر بار جایگزین می‌شود).
      # فضای Releases جدا از سهمیه‌ی Artifacts حساب است و پر نمی‌شود.
      - name: انتشار فایل نصبی در Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          tag="build-${GITHUB_REF_NAME//\//-}"
          # اسم فایل‌ها با نسخه و نوع گوشی (KankiVPN-1.15.1-arm64.apk)؛ پنل نسخه و نوع را از همین اسم می‌خواند
          ver=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          mkdir -p out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk); n=${n#app-}; n=${n%-release}
            case "$n" in arm64-v8a) a=arm64;; armeabi-v7a) a=armv7;; *) a=$n;; esac
            cp "$f" "out/KankiVPN-$ver-$a.apk"
          done
          ls -la out
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Kanki VPN · $GITHUB_REF_NAME · #$GITHUB_RUN_NUMBER" --notes "ساخت خودکار از $GITHUB_SHA"

      # فایل‌های نصبی main در پیوی تلگرام ادمین (ربات Kanki_github_bot)؛ از ایران دانلود از گیت‌هاب کامل نمی‌شود.
      # توکن ربات و آیدی عددی فقط در GitHub Secrets: TG_BOT_TOKEN و TG_CHAT_ID (اگر نباشند، این مرحله رد می‌شود)
      # موقت (۱.۳۵.۰): فایل تست برنچ کار هم به تلگرام خود صاحب اپ می‌رود (Play Protect)؛ قبل از مرج برگردد به فقط main
      - name: فرستادن فایل نصبی به تلگرام
        if: github.ref_name == 'main' || github.ref_name == 'ccr-792bc8a9-mgi5zi'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then echo "Secrets TG_BOT_TOKEN / TG_CHAT_ID not set: skipped"; exit 0; fi
          # فقط وقتی خود اپ اندروید عوض شده باشد APK فرستاده می‌شود (تغییر فقط-ویندوز APK تکراری نفرستد)
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$before^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$before" "$GITHUB_SHA" | grep -qE '^(app/|CHANGES\.md|README\.md|kmix-core/|mtun-core/|kping-core/|\.github/workflows/build\.yml)'; then
              echo "no Android changes in this push: skip Telegram"; exit 0
            fi
          fi
          ver=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          # متن از CHANGES.md خودِ اندروید (بخش بالای فایل)، نه آخرین کامیت (که ممکن است ویندوز باشد)
          msg=$(awk '/^# /{c++; next} c==1' CHANGES.md | sed 's/\*\*//g' | sed '/^[[:space:]]*$/d' | head -n 14)
          # تلگرام زیر فایل حداکثر ۱۰۲۴ حرف می‌پذیرد (۱.۲۵.۰ بیشتر بود و هر دو APK رد شدند): متن کوتاه می‌شود
          msg=$(printf '%s' "$msg" | python3 -c 'import sys; t=sys.stdin.read(); print(t if len(t) <= 880 else t[:880].rsplit("\n", 1)[0] + "\n…")')
          fail=0
          for f in out/*.apk; do
            case "$f" in *arm64*) kind="arm64 · بیشتر گوشی‌ها";; *armv7*) kind="armv7 · گوشی‌های قدیمی";; *) kind="";; esac
            r=$(curl -sS --retry 3 --max-time 300 -F chat_id="$TG_CHAT_ID" -F document=@"$f" \
              -F caption="🔐 Kanki VPN $ver · $kind
          $msg" "https://api.telegram.org/bot$TG_BOT_TOKEN/sendDocument")
            echo "$r" | head -c 300; echo
            # جواب تلگرام چک می‌شود: اگر فایل نرسید، این قدم قرمز می‌شود (قبلاً با خطا هم سبز می‌ماند)
            echo "$r" | grep -q '"ok":true' || fail=1
          done
          exit $fail
