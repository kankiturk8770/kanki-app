name: ساخت اپ کانکی
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: دریافت فونت‌ها
        run: |
          mkdir -p app/src/main/res/font
          rm -f app/src/main/res/raw/kanki_intro.wav
          dl() { curl -fsSL --retry 3 -o "app/src/main/res/font/$1" "$2" || curl -fsSL --retry 3 -o "app/src/main/res/font/$1" "$3"; }
          V1=https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf
          V2=https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf
          dl vazir_regular.ttf $V1/Vazirmatn-Regular.ttf $V2/Vazirmatn-Regular.ttf
          dl vazir_bold.ttf    $V1/Vazirmatn-Bold.ttf    $V2/Vazirmatn-Bold.ttf
          dl vazir_black.ttf   $V1/Vazirmatn-Black.ttf   $V2/Vazirmatn-Black.ttf
          G1=https://raw.githubusercontent.com/google/fonts/main/ofl
          G2=https://github.com/google/fonts/raw/main/ofl
          dl poppins_semibold.ttf $G1/poppins/Poppins-SemiBold.ttf $G2/poppins/Poppins-SemiBold.ttf
          dl poppins_bold.ttf     $G1/poppins/Poppins-Bold.ttf     $G2/poppins/Poppins-Bold.ttf
          dl orbitron.ttf "$G1/orbitron/Orbitron%5Bwght%5D.ttf" "$G2/orbitron/Orbitron%5Bwght%5D.ttf"
          ls -la app/src/main/res/font

      - name: دریافت نقشه‌ی کشورها
        run: |
          mkdir -p app/src/main/assets
          rm -f app/src/main/assets/land.geojson
          curl -fsSL --retry 3 -o app/src/main/assets/countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson || curl -fsSL --retry 3 -o app/src/main/assets/countries.geojson https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/110m/cultural/ne_110m_admin_0_countries.json || echo '{"features":[]}' > app/src/main/assets/countries.geojson
          ls -la app/src/main/assets

      - name: آماده‌سازی کلید امضا (از GitHub Secrets)
        env:
          KANKI_KEYSTORE: ${{ secrets.KANKI_KEYSTORE }}
          KANKI_KEY_PASS: ${{ secrets.KANKI_KEY_PASS }}
        run: |
          if [ -z "$KANKI_KEYSTORE" ] || [ -z "$KANKI_KEY_PASS" ]; then echo "::error::GitHub Secrets (KANKI_KEYSTORE / KANKI_KEY_PASS) تنظیم نشده‌اند"; exit 1; fi
          echo "$KANKI_KEYSTORE" | base64 -d > app/kanki-release.jks
          rm -f app/kanki-release.jks.b64
          keytool -list -keystore app/kanki-release.jks -storepass "$KANKI_KEY_PASS" | head -3

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: ساخت فایل نصبی
        env:
          KANKI_KEY_PASS: ${{ secrets.KANKI_KEY_PASS }}
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: KankiVPN-apk
          path: app/build/outputs/apk/release/*.apk
