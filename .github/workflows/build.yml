name: ساخت اپ کانکی
on:
  push:
  workflow_dispatch:

# نوشتن مخزن فقط برای گذاشتن فایل نصبی در Releases؛ کلید امضا فقط از Secrets می‌آید
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: دریافت فونت‌ها
        run: |
          mkdir -p app/src/main/res/font
          rm -f app/src/main/res/raw/kanki_intro.wav
          dl() { curl -fsSL --retry 3 -o "app/src/main/res/font/$1" "$2" || curl -fsSL --retry 3 -o "app/src/main/res/font/$1" "$3"; }
          V1=https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf
          V2=https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf
          dl vazir_regular.ttf $V1/Vazirmatn-Regular.ttf $V2/Vazirmatn-Regular.ttf
          dl vazir_bold.ttf    $V1/Vazirmatn-Bold.ttf    $V2/Vazirmatn-Bold.ttf
          dl vazir_black.ttf   $V1/Vazirmatn-Black.ttf   $V2/Vazirmatn-Black.ttf
          G1=https://raw.githubusercontent.com/google/fonts/main/ofl
          G2=https://github.com/google/fonts/raw/main/ofl
          dl poppins_semibold.ttf $G1/poppins/Poppins-SemiBold.ttf $G2/poppins/Poppins-SemiBold.ttf
          dl poppins_bold.ttf     $G1/poppins/Poppins-Bold.ttf     $G2/poppins/Poppins-Bold.ttf
          dl orbitron.ttf "$G1/orbitron/Orbitron%5Bwght%5D.ttf" "$G2/orbitron/Orbitron%5Bwght%5D.ttf"
          ls -la app/src/main/res/font

      - name: دریافت نقشه‌ی کشورها
        run: |
          mkdir -p app/src/main/assets
          rm -f app/src/main/assets/land.geojson
          curl -fsSL --retry 3 -o app/src/main/assets/countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson || curl -fsSL --retry 3 -o app/src/main/assets/countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson || curl -fsSL --retry 3 -o app/src/main/assets/countries.geojson https://raw.githubusercontent.com/martynafford/natural-earth-geojson/master/110m/cultural/ne_110m_admin_0_countries.json || echo '{"features":[]}' > app/src/main/assets/countries.geojson
          ls -la app/src/main/assets

      # نسخه‌ی هسته ثابت است (نه «آخرین نسخه»)، تا هر ساخت دقیقاً همان هسته‌ی تست‌شده را بگیرد.
      # برای ارتقا فقط HY_VERSION را عوض کن (فهرست نسخه‌ها: github.com/apernet/hysteria/releases).
      - name: دریافت هسته‌ی Hysteria2
        env:
          HY_VERSION: v2.12.3
        run: |
          set -e
          base="https://github.com/apernet/hysteria/releases/download/app%2F$HY_VERSION"
          # فهرست اثر انگشت (SHA256) فایل‌ها که خود Hysteria برای همین نسخه منتشر کرده
          curl -fsSL --retry 3 -o /tmp/hy-hashes.txt "$base/hashes.txt"
          get() { # $1=ABI اندروید  $2=اسم معماری در فایل‌های Hysteria
            d=app/src/main/jniLibs/$1; mkdir -p "$d"
            f="hysteria-android-$2"
            curl -fsSL --retry 3 -o "$d/libhysteria.so" "$base/$f"
            want=$(awk -v f="$f" '{ n = $2; sub(/^.*\//, "", n); if (n == f) print $1 }' /tmp/hy-hashes.txt)
            got=$(sha256sum "$d/libhysteria.so" | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "::error::SHA256 of $f does not match ($HY_VERSION): want=$want got=$got"; exit 1
            fi
            chmod +x "$d/libhysteria.so"
            echo "$1 <- $f ($HY_VERSION) sha256=$got"
          }
          get arm64-v8a arm64
          get armeabi-v7a armv7
          ls -la app/src/main/jniLibs/*

      # هسته‌ی Xray-core، نسخه‌ی ثابت و تست‌شده (همان که پنل با آن کانفیگ‌ها را چک می‌کند).
      # فایل‌های geoip/geosite برداشته نمی‌شوند (حجم کم)؛ کانفیگ اپ به آن‌ها نیاز ندارد.
      - name: دریافت هسته‌ی Xray-core
        env:
          XRAY_VERSION: v26.3.27
        run: |
          set -e
          base="https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION"
          get() { # $1=ABI اندروید  $2=فایل zip
            d=app/src/main/jniLibs/$1; mkdir -p "$d"
            curl -fsSL --retry 3 -o /tmp/x.zip "$base/$2"
            curl -fsSL --retry 3 -o /tmp/x.dgst "$base/$2.dgst"
            want=$(grep -m1 '^SHA2-256' /tmp/x.dgst | awk '{print $2}')
            got=$(sha256sum /tmp/x.zip | cut -d' ' -f1)
            if [ -z "$want" ] || [ "$want" != "$got" ]; then
              echo "::error::SHA256 of $2 does not match ($XRAY_VERSION): want=$want got=$got"; exit 1
            fi
            rm -rf /tmp/xr && unzip -q -o /tmp/x.zip xray -d /tmp/xr
            mv /tmp/xr/xray "$d/libxray.so"; chmod +x "$d/libxray.so"
            echo "$1 <- $2 ($XRAY_VERSION) sha256=$got"
          }
          get arm64-v8a Xray-android-arm64-v8a.zip
          get armeabi-v7a Xray-linux-arm32-v7a.zip
          ls -la app/src/main/jniLibs/*

      - name: ساخت tun2socks برای Hysteria2 (hev-socks5-tunnel)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK}}"
          if [ ! -x "$NDK/ndk-build" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          echo "NDK: $NDK"
          rm -rf /tmp/hev && mkdir -p /tmp/hev && cd /tmp/hev
          git clone --recursive --depth 1 --branch 2.17.1 https://github.com/heiher/hev-socks5-tunnel jni
          printf '%s\n' \
            'APP_OPTIM := release' \
            'APP_PLATFORM := android-26' \
            'APP_ABI := armeabi-v7a arm64-v8a' \
            'APP_CFLAGS := -O3 -DPKGNAME=cafe/kankipro/vpn -DCLSNAME=TProxyService' \
            'APP_SUPPORT_FLEXIBLE_PAGE_SIZES := true' \
            'NDK_TOOLCHAIN_VERSION := clang' > jni/Application.mk
          "$NDK/ndk-build" -j"$(nproc)"
          cd "$GITHUB_WORKSPACE"
          for a in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$a
            cp /tmp/hev/libs/$a/libhev-socks5-tunnel.so app/src/main/jniLibs/$a/
          done
          ls -la app/src/main/jniLibs/*

      # هسته‌ی KANKI MIX (پروتکل خود کانکی، پوشه‌ی kmix-core) برنامه‌ی جدای libkmix.so است، مثل Hysteria2
      # و Xray در پروسه‌ی خودش (رانتایم Go آن هیچ‌وقت کنار موتور AmneziaWG در پروسه‌ی برنامه نیست).
      # نسخه‌ی Go از go.mod همان پوشه می‌آید تا هر ساخت دقیقاً همان هسته‌ی تست‌شده باشد.
      - uses: actions/setup-go@v6
        with:
          go-version-file: kmix-core/go.mod
          cache-dependency-path: kmix-core/go.sum

      - name: ساخت هسته‌ی KANKI MIX (libkmix.so)
        working-directory: kmix-core
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK}}"
          if [ ! -d "$NDK" ]; then NDK=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1); fi
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "NDK: $NDK"
          go vet -tags tcp ./...
          go test ./internal/... ./cmd/...
          build() { # $1=ABI  $2=GOARCH  $3=clang
            d=../app/src/main/jniLibs/$1; mkdir -p "$d"
            CGO_ENABLED=1 GOOS=android GOARCH=$2 GOARM=7 CC="$TC/$3" \
              go build -tags tcp -trimpath -ldflags "-s -w" -o "$d/libkmix.so" ./cmd/kmix
            chmod +x "$d/libkmix.so"
            file "$d/libkmix.so"
          }
          build arm64-v8a arm64 aarch64-linux-android26-clang
          build armeabi-v7a arm armv7a-linux-androideabi26-clang

      - name: آماده‌سازی کلید امضا (از GitHub Secrets)
        env:
          KANKI_KEYSTORE: ${{ secrets.KANKI_KEYSTORE }}
          KANKI_KEY_PASS: ${{ secrets.KANKI_KEY_PASS }}
        run: |
          if [ -z "$KANKI_KEYSTORE" ] || [ -z "$KANKI_KEY_PASS" ]; then echo "::error::GitHub Secrets (KANKI_KEYSTORE / KANKI_KEY_PASS) تنظیم نشده‌اند"; exit 1; fi
          echo "$KANKI_KEYSTORE" | base64 -d > app/kanki-release.jks
          keytool -list -keystore app/kanki-release.jks -storepass "$KANKI_KEY_PASS" | head -3

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: ساخت فایل نصبی
        env:
          KANKI_KEY_PASS: ${{ secrets.KANKI_KEY_PASS }}
        run: gradle assembleRelease --stacktrace

      - name: حجم فایل‌ها
        run: ls -la app/build/outputs/apk/release/

      # فایل نصبی در Releases گذاشته می‌شود (یک نسخه‌ی پیش‌انتشار برای هر شاخه که هر بار جایگزین می‌شود).
      # فضای Releases جدا از سهمیه‌ی Artifacts حساب است و پر نمی‌شود.
      - name: انتشار فایل نصبی در Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          tag="build-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" app/build/outputs/apk/release/*.apk --prerelease --target "$GITHUB_SHA" \
            --title "Kanki VPN · $GITHUB_REF_NAME · #$GITHUB_RUN_NUMBER" --notes "ساخت خودکار از $GITHUB_SHA"
