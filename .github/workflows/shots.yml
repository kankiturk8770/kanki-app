name: عکس صفحه‌های اپ
# صفحه‌های واقعی برنامه با داده‌ی نمونه، بدون گوشی (app/src/test/.../Shots.kt، Robolectric).
# عکس‌ها در شاخه‌ی shots گذاشته می‌شوند (نه Artifact: سهمیه‌ی Artifacts حساب پر است). به فایل نصبی ربطی ندارد.
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, shots]
    paths:
      - "app/src/test/**"
      - "app/src/main/java/**/*Ui.kt"
      - ".github/workflows/shots.yml"

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: دریافت فونت‌ها و نقشه
        run: |
          mkdir -p app/src/main/res/font app/src/main/assets
          rm -f app/src/main/res/raw/kanki_intro.wav
          dl() { curl -fsSL --retry 3 -o "app/src/main/res/font/$1" "$2" || curl -fsSL --retry 3 -o "app/src/main/res/font/$1" "$3"; }
          V1=https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf
          V2=https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf
          dl vazir_regular.ttf $V1/Vazirmatn-Regular.ttf $V2/Vazirmatn-Regular.ttf
          dl vazir_bold.ttf    $V1/Vazirmatn-Bold.ttf    $V2/Vazirmatn-Bold.ttf
          dl vazir_black.ttf   $V1/Vazirmatn-Black.ttf   $V2/Vazirmatn-Black.ttf
          G1=https://raw.githubusercontent.com/google/fonts/main/ofl
          G2=https://github.com/google/fonts/raw/main/ofl
          dl poppins_semibold.ttf $G1/poppins/Poppins-SemiBold.ttf $G2/poppins/Poppins-SemiBold.ttf
          dl poppins_bold.ttf     $G1/poppins/Poppins-Bold.ttf     $G2/poppins/Poppins-Bold.ttf
          dl orbitron.ttf "$G1/orbitron/Orbitron%5Bwght%5D.ttf" "$G2/orbitron/Orbitron%5Bwght%5D.ttf"
          curl -fsSL --retry 3 -o app/src/main/assets/countries.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson || echo '{"features":[]}' > app/src/main/assets/countries.geojson

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: کشیدن صفحه‌ها
        run: gradle :app:testDebugUnitTest --tests "cafe.kankipro.vpn.Shots" --stacktrace

      - name: گذاشتن عکس‌ها در شاخه‌ی shots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la app/build/shots
          d=$(mktemp -d)
          cp app/build/shots/*.png "$d/"
          if [ -d app/build/shots/frames ]; then cp -r app/build/shots/frames "$d/"; fi
          cd "$d"
          git init -q -b shots
          git config user.name "kanki-shots"
          git config user.email "shots@users.noreply.github.com"
          git add -A
          git commit -qm "screenshots of ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shots
