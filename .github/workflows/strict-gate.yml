name: Strict Engineering Gate

on:
  push:
  pull_request:

jobs:
  quality-and-security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block Placeholders & Dummy Code
        # Vendored upstream WireGuard for Windows files (MIT, see windows/LICENSES.txt) are kept
        # byte-for-byte so they can be diffed against upstream; their upstream notes are not ours.
        env:
          UPSTREAM_WG_WINDOWS: |
            ./windows/service/internal/firewall/rules.go
            ./windows/service/internal/firewall/zsyscall_windows.go
        run: |
          hits=$(grep -rnE '\b(TODO|FIXME|PLACEHOLDER)\b|todo!\(\)|unimplemented!\(\)' --include='*.go' --include='*.rs' --include='*.kt' --include='*.sh' . \
            | grep -vF -f <(printf '%s\n' "$UPSTREAM_WG_WINDOWS" | sed '/^$/d; s/$/:/') || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "ERROR: Found banned placeholder or incomplete code."
            exit 1
          fi

      - name: Check Shell Scripts
        run: |
          sh_files=$(find . -name '*.sh' -not -path './.git/*')
          if [ -n "$sh_files" ]; then
            echo "$sh_files" | xargs shellcheck
          fi

      - name: Verify Go
        if: hashFiles('**/go.mod') != ''
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            (cd "$(dirname "$f")" && go vet ./... && go test -race ./...)
          done < <(find . -name 'go.mod' -not -path './.git/*' -print0)

      - name: Verify Rust
        if: hashFiles('**/Cargo.toml') != ''
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            (cd "$(dirname "$f")" && cargo clippy --all-targets -- -D warnings && cargo test)
          done < <(find . -name 'Cargo.toml' -not -path './.git/*' -print0)

      - name: Verify Kotlin / Android
        if: hashFiles('**/gradlew') != ''
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            (cd "$(dirname "$f")" && chmod +x gradlew && ./gradlew testDebugUnitTest)
          done < <(find . -name 'gradlew' -not -path './.git/*' -print0)
