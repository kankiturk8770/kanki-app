name: ساخت نسخه‌ی ویندوز
on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # منطق سرویس (کانفیگ، مسیرها، اشتراک، مدیریت اتصال، پایپ) روی لینوکس با race detector
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows/service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/service/go.mod
          cache-dependency-path: windows/service/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: "1.0.0"
      # https://www.wintun.net/builds/wintun-0.14.1.zip
      WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/service/go.mod
          cache-dependency-path: windows/service/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: دریافت Wintun (با چک SHA256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $got = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:WINTUN_SHA256) { throw "wintun.zip SHA256 mismatch: $got" }
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll dist\
          # for the admin tests: test binaries run from a temp folder and find it in System32
          Copy-Item wintun\wintun\bin\amd64\wintun.dll "$env:windir\System32\"
          Get-Content windows\LICENSES.txt, wintun\wintun\LICENSE.txt | Set-Content dist\LICENSES.txt

      - name: ساخت سرویس (Go)
        working-directory: windows/service
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w -X main.Version=${{ env.VERSION }}" -o ..\..\dist\kanki-svc.exe .\cmd\kanki-svc

      # روی خود ویندوز: ساختارهای WFP، و با دسترسی ادمین کارت شبکه، مسیرها، DNS و قوانین فایروال واقعی
      - name: تست سرویس روی ویندوز
        working-directory: windows/service
        env:
          KANKI_ADMIN_TESTS: "1"
        run: go test -count=1 -v ./internal/firewall/ ./internal/tunnel/ ./internal/core/ ./internal/ipc/

      - name: ساخت برنامه (WPF)
        run: dotnet publish windows\ui\KankiVPN\KankiVPN.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }} -o publish

      - name: عکس صفحه‌ها
        shell: pwsh
        run: |
          Copy-Item publish\KankiVPN.exe dist\
          $p = Start-Process -FilePath dist\KankiVPN.exe -ArgumentList '--shot', "$PWD\shots" -PassThru -Wait
          if (Test-Path shots\crash.log) { Get-Content shots\crash.log }
          $n = (Get-ChildItem shots -Filter *.png).Count
          if ($n -ne 21) { throw "expected 21 screenshots, got $n (exit $($p.ExitCode))" }

      - name: تست نصب سرویس و پایپ
        shell: pwsh
        run: .\windows\installer\smoke.ps1 dist

      - name: ساخت فایل نصبی
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=$env:VERSION /DSrc=..\..\dist windows\installer\kanki.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      # when the account's artifact storage is full the build itself still counts
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: KankiVPN-Windows-${{ env.VERSION }}
          path: |
            dist/KankiVPN-Setup-*.exe
            dist/KankiVPN.exe
            dist/kanki-svc.exe
            dist/wintun.dll
            dist/LICENSES.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-shots
          path: shots/

      # four pages side by side as one small JPEG, as text in the log (readable even without artifacts)
      - name: عکس‌ها در لاگ
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $names = 'fa-400-home', 'fa-400-servers', 'fa-400-settings', 'fa-400-login'
          $sheet = New-Object System.Drawing.Bitmap 800, 360
          $g = [System.Drawing.Graphics]::FromImage($sheet)
          $g.InterpolationMode = 'HighQualityBicubic'
          for ($i = 0; $i -lt 4; $i++) {
            $img = [System.Drawing.Image]::FromFile("$PWD\shots\$($names[$i]).png")
            $g.DrawImage($img, $i * 200, 0, 200, 360)
            $img.Dispose()
          }
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $q = New-Object System.Drawing.Imaging.EncoderParameters 1
          $q.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 70L
          $sheet.Save("$PWD\sheet.jpg", $codec, $q)
          $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\sheet.jpg"))
          Write-Host "SHOT-BEGIN $($b.Length)"
          for ($i = 0; $i -lt $b.Length; $i += 4000) { Write-Host ("SHOT " + $b.Substring($i, [Math]::Min(4000, $b.Length - $i))) }
          Write-Host "SHOT-END"
