name: ساخت نسخه‌ی ویندوز
on:
  push:
    paths:
      - "windows/**"
      - "kmix-core/**"
      - "mtun-core/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

# نوشتن مخزن فقط برای گذاشتن فایل نصبی ویندوز در Releases (پیش‌انتشار)
permissions:
  contents: write

jobs:
  # منطق سرویس (کانفیگ، مسیرها، اشتراک، مدیریت اتصال، پایپ) روی لینوکس با race detector
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: windows/service
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/service/go.mod
          cache-dependency-path: windows/service/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: GOOS=windows go vet -tags tcp ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: "1.2.0"
      # the same core versions as the Android app (build.yml)
      XRAY_VERSION: v26.3.27
      HY_VERSION: v2.12.3
      GARBLE_VERSION: v0.17.0
      # https://www.wintun.net/builds/wintun-0.14.1.zip
      WINTUN_SHA256: 07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/service/go.mod
          cache-dependency-path: windows/service/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: دریافت Wintun (با چک SHA256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          $got = (Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:WINTUN_SHA256) { throw "wintun.zip SHA256 mismatch: $got" }
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item wintun\wintun\bin\amd64\wintun.dll dist\
          # for the admin tests: test binaries run from a temp folder and find it in System32
          Copy-Item wintun\wintun\bin\amd64\wintun.dll "$env:windir\System32\"
          Get-Content windows\LICENSES.txt, wintun\wintun\LICENSE.txt | Set-Content dist\LICENSES.txt

      - name: دریافت هسته‌های Xray و Hysteria2 (با چک SHA256)
        shell: pwsh
        run: |
          $xb = "https://github.com/XTLS/Xray-core/releases/download/$env:XRAY_VERSION"
          Invoke-WebRequest "$xb/Xray-windows-64.zip" -OutFile xray.zip
          Invoke-WebRequest "$xb/Xray-windows-64.zip.dgst" -OutFile xray.dgst
          $want = ((Get-Content xray.dgst | Where-Object { $_ -like 'SHA2-256*' } | Select-Object -First 1) -split '\s+')[1]
          $got = (Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLower()
          if (-not $want -or $want -ne $got) { throw "Xray SHA256 mismatch: want=$want got=$got" }
          Expand-Archive xray.zip -DestinationPath xr
          Copy-Item xr\xray.exe dist\
          $hb = "https://github.com/apernet/hysteria/releases/download/app%2F$env:HY_VERSION"
          Invoke-WebRequest "$hb/hysteria-windows-amd64.exe" -OutFile dist\hysteria.exe
          Invoke-WebRequest "$hb/hashes.txt" -OutFile hy-hashes.txt
          $want = (Get-Content hy-hashes.txt | Where-Object { $_ -match 'hysteria-windows-amd64\.exe$' } | Select-Object -First 1) -split '\s+' | Select-Object -First 1
          $got = (Get-FileHash dist\hysteria.exe -Algorithm SHA256).Hash.ToLower()
          if (-not $want -or $want -ne $got) { throw "Hysteria SHA256 mismatch: want=$want got=$got" }
          Add-Content dist\LICENSES.txt "`n- Xray-core $env:XRAY_VERSION (xray.exe), MPL-2.0, https://github.com/XTLS/Xray-core`n- Hysteria $env:HY_VERSION (hysteria.exe), MIT, https://github.com/apernet/hysteria`n- tun2socks, MIT, https://github.com/xjasonlyu/tun2socks`n"

      # garble: names and strings of our code hidden in the exe; no packer (nothing for antivirus to flag)
      - name: ساخت سرویس (Go، با garble)
        working-directory: windows/service
        env:
          CGO_ENABLED: "0"
        run: |
          go install mvdan.cc/garble@${{ env.GARBLE_VERSION }}
          garble -literals -tiny build -tags tcp -trimpath -ldflags "-X main.Version=${{ env.VERSION }}" -o ..\..\dist\kanki-svc.exe .\cmd\kanki-svc
          ..\..\dist\kanki-svc.exe version

      # روی خود ویندوز: ساختارهای WFP، و با دسترسی ادمین کارت شبکه، مسیرها، DNS و قوانین فایروال واقعی
      - name: تست سرویس روی ویندوز
        working-directory: windows/service
        env:
          KANKI_ADMIN_TESTS: "1"
        run: go test -count=1 -tags tcp -v ./internal/firewall/ ./internal/tunnel/ ./internal/core/ ./internal/ipc/ ./internal/state/ ./internal/cores/

      - name: ساخت برنامه (WPF، با Obfuscar)
        run: |
          dotnet tool install --global Obfuscar.GlobalTool
          dotnet publish windows\ui\KankiVPN\KankiVPN.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:Version=${{ env.VERSION }} -p:Obfuscate=true -o publish

      - name: عکس صفحه‌ها
        shell: pwsh
        run: |
          Copy-Item publish\KankiVPN.exe dist\
          $p = Start-Process -FilePath dist\KankiVPN.exe -ArgumentList '--shot', "$PWD\shots" -PassThru -Wait
          if (Test-Path shots\crash.log) { Get-Content shots\crash.log }
          $n = (Get-ChildItem shots -Filter *.png).Count
          if ($n -ne 28) { throw "expected 28 screenshots, got $n (exit $($p.ExitCode))" }

      # همه‌ی عکس‌ها در شاخه‌ی shots-windows (مثل shots اندروید)، برای مقایسه‌ی کنار هم با اندروید
      - name: عکس‌ها در شاخه‌ی shots-windows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd shots
          git init -q -b shots-windows
          git config user.name "kanki-shots"
          git config user.email "shots@users.noreply.github.com"
          git add -A
          git commit -qm "windows screenshots of ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" shots-windows

      - name: تست نصب سرویس و پایپ
        shell: pwsh
        run: .\windows\installer\smoke.ps1 dist

      - name: ساخت فایل نصبی
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /DAppVersion=$env:VERSION /DSrc=..\..\dist windows\installer\kanki.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      # the setup file in Releases (not counted in the Actions storage); a pre-release, so the Android
      # app's latest release stays the latest
      - name: گذاشتن فایل نصبی در Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-v$env:VERSION"
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag --prerelease --target $env:GITHUB_SHA --title "Kanki VPN Windows $env:VERSION" `
            --notes "نسخه‌ی ویندوز. فایل نصبی: KankiVPN-Setup-$env:VERSION.exe (نصب با دسترسی ادمین). هنوز امضای دیجیتال ندارد: در هشدار ویندوز More info و بعد Run anyway." `
            "dist\KankiVPN-Setup-$env:VERSION.exe"
          Compress-Archive -Path shots\*.png -DestinationPath KankiVPN-screenshots.zip
          gh release upload $tag KankiVPN-screenshots.zip --clobber

      # when the account's artifact storage is full the build itself still counts
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: KankiVPN-Windows-${{ env.VERSION }}
          path: |
            dist/KankiVPN-Setup-*.exe
            dist/KankiVPN.exe
            dist/kanki-svc.exe
            dist/wintun.dll
            dist/xray.exe
            dist/hysteria.exe
            dist/LICENSES.txt
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-shots
          path: shots/

      # the main screens as JPEGs in the log (readable even without artifacts)
      - name: عکس‌ها در لاگ
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $q = New-Object System.Drawing.Imaging.EncoderParameters 1
          $q.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 82L
          foreach ($n in 'yellow-fa-home-off','yellow-fa-home-on','yellow-fa-servers','yellow-fa-speed','yellow-fa-settings','yellow-fa-account','yellow-fa-login','crimson-fa-home-on','yellow-en-home-on') {
            $img = [System.Drawing.Image]::FromFile("$PWD\shots\$n.png")
            $img.Save("$PWD\$n.jpg", $codec, $q)
            $img.Dispose()
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\$n.jpg"))
            Write-Host "SHOT-BEGIN $n"
            for ($i = 0; $i -lt $b.Length; $i += 4000) { Write-Host ("SHOT " + $b.Substring($i, [Math]::Min(4000, $b.Length - $i))) }
            Write-Host "SHOT-END $n"
          }
